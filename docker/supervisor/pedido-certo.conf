[program:pedido-certo-queue]
command=php /var/www/html/artisan queue:work redis --queue=critical,messages,orders,webhooks,automations,campaigns,reports,imports,notifications,default --sleep=1 --tries=3
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue.log

[program:pedido-certo-reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/reverb.log
